[project]
name = "logidelay-copilot"
version = "0.1.0"
description = "Explainable AI for logistics delay diagnosis using event logs and Operational Exception Severity"
readme = "README.md"
authors = [
    { name = "Abhishek Kumar", email = "abhik12295@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.0",
    "joblib>=1.4.2",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.5.0",
    "streamlit>=1.37.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "logidelay"
module-root = "src"

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]
